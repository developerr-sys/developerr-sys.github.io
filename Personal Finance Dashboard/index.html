<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard - Live App</title>
    <meta name="description" content="A responsive personal finance dashboard featuring total balance calculation, income/expense tracking, real-time lists, and localStorage integration.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Full Width Top Navbar Header -->
    <nav class="standalone-nav">
        <div class="nav-brand-box">
            <i class="fa-solid fa-chart-line"></i>
            <span class="brand-title-text">Personal Finance Dashboard</span>
        </div>
        <div class="nav-actions-box">
            <a href="../pages/projects.html" class="back-projects-btn">
                ← Back to Projects
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="finance-container">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Personal Finance Tracker</h2>
            <p class="text-secondary small">Track your daily income, expenses & net savings in real-time</p>
        </div>

        <div class="glass-card">
            <!-- Stat boxes -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="stat-box">
                        <span class="text-secondary small fw-bold">TOTAL BALANCE</span>
                        <div id="total-balance" class="stat-val val-balance">$0.00</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <span class="text-secondary small fw-bold">TOTAL INCOME</span>
                        <div id="total-income" class="stat-val val-income">+$0.00</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <span class="text-secondary small fw-bold">TOTAL EXPENSES</span>
                        <div id="total-expense" class="stat-val val-expense">-$0.00</div>
                    </div>
                </div>
            </div>

            <!-- Transaction form -->
            <form id="transaction-form" class="finance-form">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="trans-title" class="finance-input" placeholder="Transaction Name (e.g. Salary)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" id="trans-amount" class="finance-input" placeholder="Amount ($)" required>
                    </div>
                    <div class="col-md-3">
                        <select id="trans-type" class="finance-input" title="Transaction type" aria-label="Transaction type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn-add-transaction">Add</button>
                    </div>
                </div>
            </form>

            <!-- Transaction list -->
            <h5 class="mb-3 fw-bold">Recent Transactions</h5>
            <ul id="transaction-list" class="transaction-list">
                <!-- Javascript will insert elements here -->
            </ul>

            <!-- Empty state -->
            <div id="empty-state" class="empty-trans-state" style="display: none;">
                <i class="fa-solid fa-receipt empty-trans-icon"></i>
                <p class="mb-0 fw-semibold">No transactions recorded yet</p>
                <span class="text-secondary small">Fill in the fields above to add records.</span>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic -->
    <script src="script.js"></script>
</body>

</html>
