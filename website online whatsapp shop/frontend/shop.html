<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Loading...</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="shop-body theme-whatsapp-green">
    <!-- The theme class will be injected into the body by shop.js -->
    
    <nav class="shop-navbar">
        <div class="nav-content">
            <div class="nav-brand">
                <span class="nav-icon">🛍️</span>
                <span id="navShopName" class="nav-shop-name">Shop</span>
            </div>
            
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search products..." class="search-input">
            </div>

            <div class="nav-links">
                <a href="../../pages/projects.html" class="nav-btn-outline" title="Back to Projects">← Back to Projects</a>
                <a href="index.html" class="nav-btn-outline" title="Create New Shop">⚡ Create Shop</a>
                <a href="#" id="navContactBtn" target="_blank" class="nav-btn-icon" title="Contact Us">📞</a>
                <button id="darkModeToggle" class="nav-btn-icon" title="Toggle Dark Mode">🌙</button>
                <button id="cartToggleBtn" class="nav-btn-outline cart-btn">
                    🛒 Cart <span id="cartBadge" class="cart-badge">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="shop-header">
        <div class="shop-header-content">
            <h1 id="displayShopName">Loading...</h1>
            <p id="displayShopDescription" class="shop-description"></p>
        </div>
    </header>

    <main class="shop-main-container">
        <div class="shop-controls">
            <h2 class="section-title">Our Products</h2>
            <div id="categoryContainer" class="category-filters">
                <!-- Categories will be injected here -->
            </div>
        </div>
        
        <div id="productsContainer" class="products-grid">
            <!-- Products will be injected here -->
        </div>
    </main>

    <footer class="shop-footer">
        <p>Powered by <strong>WhatsApp Shop Generator</strong></p>
    </footer>

    <!-- Shopping Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="closeCartBtn" class="close-btn">&times;</button>
        </div>
        <div id="cartItemsContainer" class="cart-items">
            <!-- Cart items will be injected here -->
            <div class="cart-empty-state">Your cart is empty.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalPrice">0.00</span>
            </div>
            <button id="checkoutBtn" class="btn-whatsapp checkout-btn" disabled>
                Checkout on WhatsApp
            </button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="store.js"></script>
    <script src="shop.js"></script>
</body>
</html>
