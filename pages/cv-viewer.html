<!DOCTYPE html>

<head>

    <!-- Google Fonts -->

    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cv-top-header-bar {
            position: sticky;
            top: 0;
            z-index: 1050;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .cv-page-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 15px;
        }

        .cv-paper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .cv-paper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Sticky Top Header Bar with Download Option Top of CV -->
    <header class="cv-top-header-bar">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Portfolio

                <span class="fs-5 fw-bold d-none d-sm-inline-block text-white">
                    <i class="fa-solid fa-file-pdf text-accent me-2"></i>Anmol Akber - CV

            <div class="d-flex align-items-center gap-3">
                <a href="../Anmol CV.jpg" download="Anmol_Akber_CV.jpg" class="btn-cv-download-top">
                    <i class="fa-solid fa-download"></i> Download CV
                </a>
                <a href="../Anmol CV.jpg" target="_blank" class="btn btn-outline-light btn-sm rounded-circle p-2" title="Open Raw Image">
                    <i class="fa-solid fa-expand"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- CV Main Display Page -->
    <main class="cv-page-container">
        <div class="cv-paper">
            <img src="../Anmol CV.jpg" alt="Anmol Akber Curriculum Vitae">
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer text-center mt-0">
        <div class="container">
            <p class="mb-0">Developed By <span class="text-accent">Anmol Akber</span> &copy; 2026. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->

    <!-- Custom JS -->
    <script src="../script.js"></script>
